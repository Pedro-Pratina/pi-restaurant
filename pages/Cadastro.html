<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nu Sushi</title>

  <link rel="stylesheet" href="../assets/css/pages/cadastro.css" />
  <link rel="icon" type="image/png" href="../assets/images/logo.png" />
  <script src="../assets/scripts/cadastro.js" defer></script>
</head>
<body>

  <main class="cadastro-container">
    <section class="cadastro-card">
      <div class="top-actions">
        <a href="../index.html" class="back-btn">
          X
        </a>
      </div>

      <div class="cadastro-header">
        <div class="logo">
          <img src="../assets/images/logo.png" alt="Logo Nu Sushi" />
        </div>

        <h1>Crie sua conta!</h1>

        <p>
          Preencha os campos abaixo para criar sua conta
        </p>
      </div>

      <form id="cadastroForm" class="cadastro-form">
        <div class="form-group">
          <label for="nome">Nome</label>

          <input
            type="text"
            id="nome"
            placeholder="Seu nome"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>

          <input
            type="email"
            id="email"
            placeholder="seu@email.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Crie uma Senha</label>

          <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirme a Senha</label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="••••••••"
            required
          />
        </div>

        <button type="submit" class="btn-primary">
          Cadastrar
        </button>

      </form>

      <div class="register-text">
        <p>
          Já tem uma conta?
          <a href="./login.html" class="register-btn">
            Entrar
          </a>
        </p>
      </div>

      <div class="demo-box">
        <p>
          <strong>Demo:</strong>
          Use qualquer e-mail e senha para se cadastrar.
        </p>
      </div>

    </section>
  </main>
</body>
</html>
